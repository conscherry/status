status-website:
  cname: status.conscherry.com
  logoHref: https://status.conscherry.com
  logoUrl: https://status.conscherry.com/logo.png
  favicon: https://status.conscherry.com/logo.png
  name: Conscherry
  introTitle: "Welcome to the Conscherry Status Page"
  introMessage: Here you can find the current status of our services and any ongoing incidents. If you have any questions or concerns, please reach out to us through our support channels.
  navbar:
    - title: Overview
      href: /
    - title: Help
      href: https://conscherry.com/help
    - title: Website
      href: https://conscherry.com
  theme: light
  themeUrl: https://raw.githubusercontent.com/conscherry/status/refs/heads/master/assets/theme.css
  links:
    - rel: stylesheet
      href: https://raw.githubusercontent.com/conscherry/status/refs/heads/master/assets/theme.css

