owner: conscherry
repo: status

assignees:
  - xgarciadevs

secrets:
  - KINDBOT_API_URL
  - PROJECT_HOST_URL
  - PROJECT_HOST_PORT

sites:
  - name: Conscherry
    url: https://conscherry.com
  - name: Conscherry Dashboard
    url: https://dashboard.conscherry.com
  - name: Indenti
    url: https://indenti.net
  - name: API Services
    url: https://conscherry.com/api/health
  - name: Labs API Services
    url: https://labs.conscherry.com/api/health
  - name: KindBot Health
    check: "tcp-ping"
    url: $KINDBOT_API_URL
    port: $PROJECT_HOST_PORT
  - name: Labs
    url: https://labs.conscherry.com/
  - name: The Gobble Project
    url: https://playgobble.xyz
  - name: Project Host
    check: "tcp-ping"
    url: $PROJECT_HOST_URL
    port: $PROJECT_HOST_PORT

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  # cname: demo.upptime.js.org
  baseUrl: /status
  logoUrl: https://conscherry.github.io/status/logo.png
  favicon: https://conscherry.github.io/status/logo.png
  name: Conscherry
  introTitle: "Welcome to the Conscherry Status Page"
  introMessage: Here you can find the current status of our services and any ongoing incidents. If you have any questions or concerns, please reach out to us through our support channels.
  theme: custom
  themeUrl: https://conscherry.github.io/status/theme.css
  navbar:
    - title: Overview
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
    - title: Website
      href: https://conscherry.com

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
