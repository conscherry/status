name: Status Page
on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "scripts/build-site.mjs"
      - "assets/logo.png"
      - ".github/workflows/status-page.yml"
  workflow_run:
    workflows: ["Static Site CI"]
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-status-page
  cancel-in-progress: false
permissions:
  contents: write
  issues: read
jobs:
  deploy:
    name: Build and deploy status page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build site
        run: node scripts/build-site.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_PAT || github.token }}
          publish_dir: dist
          cname: status.conscherry.com
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
