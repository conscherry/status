name: Status Page

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "scripts/build-site.mjs"
      - "assets/logo.png"
      - ".upptimerc.yml"
      - ".github/workflows/status-page.yml"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: status-page-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy status page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build site
        run: node scripts/build-site.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
